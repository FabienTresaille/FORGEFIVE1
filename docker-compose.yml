services:
  db:
    image: postgres:16-alpine
    container_name: forgefive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgefive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgefive_secret}
      POSTGRES_DB: ${POSTGRES_DB:-forgefive}
    volumes:
      - forgefive_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgefive} -d ${POSTGRES_DB:-forgefive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgefive-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://forgefive:forgefive_secret@db:5432/forgefive}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_for_forgefive}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@example.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin123}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://perfs.alsek.fr}
      DOMAIN: ${DOMAIN:-perfs.alsek.fr}
    networks:
      - internal
      - audit-app_web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=audit-app_web"
      - "traefik.http.routers.vision-api.rule=Host(`perfs.alsek.fr`) && PathPrefix(`/api`)"
      - "traefik.http.routers.vision-api.tls=true"
      - "traefik.http.routers.vision-api.priority=100"
      - "traefik.http.services.forgefive-backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.vision-api.service=forgefive-backend"
      - "traefik.http.middlewares.vision-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.vision-api.middlewares=vision-api-strip"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-perfs.alsek.fr}/api
    container_name: forgefive-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - audit-app_web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=audit-app_web"
      - "traefik.http.routers.vision.rule=Host(`perfs.alsek.fr`)"
      - "traefik.http.routers.vision.tls=true"
      - "traefik.http.routers.vision.priority=10"
      - "traefik.http.services.forgefive-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.vision.service=forgefive-frontend"

volumes:
  forgefive_pgdata:
    name: forgefive_pgdata

networks:
  internal:
    driver: bridge
  audit-app_web:
    external: true
